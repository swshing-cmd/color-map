<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區色彩文學地圖 | Community Color Literature Map</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        tailwind.config = {

                extend: {
                    colors: {

                            card: '#1c1e26',
                            accent: '#d97706',
                            fadedRed: '#ef4444',
                            rustGreen: '#10b981',
                            warmYellow: '#f59e0b',
                            coolGrey: '#9ca3af',
                            neonRed: '#f43f5e'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif']
                    }
                }
            }
        }

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121316;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }

        /* Leaflet Dark Theme Overrides */
        .leaflet-container {
            background-color: #0f1115 !important;
            font-family: 'Inter', sans-serif;
        }
        .leaflet-popup-content-wrapper {
            background: #1e2028 !important;
            color: #f3f4f6 !important;
            border-radius: 12px !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
            padding: 4px !important;
            border: 1px solid #374151;
        }
        .leaflet-popup-tip {
            background: #1e2028 !important;
        }
        .leaflet-container a.leaflet-popup-close-button {
            color: #9ca3af !important;
            padding: 8px 10px 0 0 !important;
        }
        .leaflet-container a.leaflet-popup-close-button:hover {
            color: #ffffff !important;
        }

        /* Custom Marker Pin Animation */
        .custom-pin {
            display: flex;
            align-items: center;

            border-radius: 50%;

            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

</head>
<body class="bg-brand-dark text-gray-100 min-h-screen flex flex-col font-sans antialiased bg-grid-pattern selection:bg-amber-500 selection:text-black">

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-40 bg-brand-dark/90 backdrop-blur-md border-b border-gray-800 px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-rose-600 flex items-center justify-center text-black font-bold text-xl shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-palette"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold font-serif tracking-wide text-white flex items-center gap-2">
                    社區色彩文學地圖

                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                        <span>雲端連線中...</span>
                    </span>
                </h1>
                <p class="text-xs text-gray-400">捕捉街道色彩密碼 · 解讀城市生活詩意（全級即時同步版）</p>
            </div>
        </div>

        <!-- Center Controls: View Switcher -->
        <div class="flex items-center bg-gray-900 p-1 rounded-xl border border-gray-800 text-sm">
            <button id="btn-view-map" onclick="switchView('map')" class="flex items-center gap-2 px-4 py-1.5 rounded-lg font-medium transition-all bg-amber-500 text-black shadow-md">

            <button id="btn-view-gallery" onclick="switchView('gallery')" class="flex items-center gap-2 px-4 py-1.5 rounded-lg font-medium text-gray-400 hover:text-white transition-all">
                <i class="fa-solid fa-grip"></i> 圖文畫廊
            </button>
        </div>

        <!-- Right Action Buttons -->
        <div class="flex items-center gap-3">
            <!-- Audio Ambient Toggle -->
            <button id="btn-audio" onclick="toggleAmbientAudio()" class="px-3 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700 transition flex items-center gap-2 text-sm" title="背景氛圍音效">
                <i id="audio-icon" class="fa-solid fa-volume-xmark text-gray-400"></i>
                <span class="hidden sm:inline text-xs">街道聲景</span>
            </button>

            <!-- Submit Story Button -->
            <button onclick="openSubmitModal()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-semibold text-sm shadow-lg shadow-amber-500/20 transition flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i>
                <span>上載色彩故事</span>
            </button>
        </div>
    </header>

    <!-- FILTER BAR -->
    <section class="bg-gray-900/60 border-b border-gray-800/80 px-4 lg:px-8 py-3 flex items-center gap-2 overflow-x-auto no-scrollbar">
        <span class="text-xs font-semibold text-gray-400 whitespace-nowrap uppercase tracking-wider mr-2 flex items-center gap-1">
            <i class="fa-solid fa-filter text-amber-500"></i> 色彩分類:
        </span>
        
        <div id="filter-buttons" class="flex items-center gap-2">
            <!-- Dynamic Filters inserted via JS -->
        </div>
    </section>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 relative overflow-hidden flex flex-col">
        
        <!-- MAP VIEW -->
        <div id="view-map-container" class="relative w-full h-[calc(100vh-130px)] flex-1">
            <div id="map" class="w-full h-full z-10"></div>

            <!-- Floating Quick Stats Overlay -->

                <div class="flex items-center justify-between font-bold text-gray-200">
                    <span><i class="fa-solid fa-compass text-amber-500 mr-1"></i> 全級採集地點</span>
                    <span id="stat-count" class="text-amber-400 font-mono text-sm">0 處</span>
                </div>
                <p class="text-gray-400 leading-relaxed">
                    點擊地圖上的彩點標籤，細心體會同學拍攝的街道色彩、質感變化與背後的文學詩意。
                </p>
                <div class="pt-2 flex items-center gap-2 border-t border-gray-800 text-[11px] text-gray-400">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500"></span> 舊區民生
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 ml-2"></span> 生鏽苔綠
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 ml-2"></span> 煙火暖燈
                </div>
            </div>
        </div>

        <!-- GALLERY VIEW (Initially Hidden) -->

            <div class="max-w-7xl mx-auto">

                    <div>
                        <h2 class="text-2xl font-bold font-serif text-white">全級學生文學作品畫廊</h2>
                        <p class="text-sm text-gray-400">瀏覽全級同學採集的街道意象與文學感悟（即時雲端數據）</p>
                    </div>
                    <div class="text-xs text-gray-400 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg">
                        共記錄 <span id="gallery-count" class="text-amber-400 font-bold">0</span> 份色彩作品
                    </div>
                </div>

                <!-- Gallery Cards Grid -->
                <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Dynamic Gallery Cards -->
                </div>
            </div>
        </div>
    </main>

    <!-- SUBMIT STORY MODAL -->
    <div id="modal-submit" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 relative">
            <button onclick="closeSubmitModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-500">
                    <i class="fa-solid fa-pen-nib text-lg"></i>
                </div>
                <div>
                    <h3 class="text-xl font-bold font-serif text-white">上載色彩故事到地圖</h3>
                    <p class="text-xs text-gray-400">資料將即時同步至全級地圖，供全體同學與老師賞析</p>
                </div>
            </div>

            <form id="form-submit-story" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">學生姓名 *</label>
                        <input type="text" id="input-author" required placeholder="例如：陳大文" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">班別 / 學號 *</label>
                        <input type="text" id="input-class" required placeholder="例如：4A (12)" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">色彩主題 *</label>
                        <select id="input-tag" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition">
                            <option value="褪色紅">褪色紅 (老舊門聯/生鏽鐵門)</option>
                            <option value="生鏽綠">生鏽綠 (牆角野草/苔蘚微光)</option>
                            <option value="暖黃燈">暖黃燈 (傳統檔口/煙火人間)</option>
                            <option value="冷白灰">冷白灰 (現代玻璃/秩序大理石)</option>
                            <option value="霓虹紅">霓虹紅 (繁華商業/璀璨招牌)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">街道類型 *</label>
                        <select id="input-category" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition">
                            <option value="舊區街道">舊區 / 民生街道 (煙火人情)</option>
                            <option value="新式街道">新式 / 商業街道 (現代秩序)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">街道 / 具體地點名稱 *</label>
                    <input type="text" id="input-location" required placeholder="例如：深水埗基隆街128號" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition">
                </div>

                <!-- Coordinates Picker -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-gray-300">地圖定位座標 (點擊地圖可更新坐標)</label>
                        <span class="text-[11px] text-amber-400/90"><i class="fa-solid fa-crosshairs mr-1"></i>預設設於深水埗</span>
                    </div>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="input-lat" readonly placeholder="緯度 (Lat)" class="w-1/2 bg-gray-800/80 border border-gray-700 rounded-xl px-3 py-2 text-xs text-amber-300 font-mono">
                        <input type="text" id="input-lng" readonly placeholder="經度 (Lng)" class="w-1/2 bg-gray-800/80 border border-gray-700 rounded-xl px-3 py-2 text-xs text-amber-300 font-mono">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">文學短句 / 一句話詩行 *</label>
                    <textarea id="input-quote" rows="2" required placeholder="例如：歲月剝落了紅漆，卻留下了幾代人進出的體溫。" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition font-serif"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">五感與色彩觀察</label>
                    <textarea id="input-desc" rows="2" placeholder="描繪當地的氣味、質感、光線或人情感受..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition"></textarea>
                </div>

                <!-- Image File / URL Input -->
                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-gray-300">照片上載方式</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <input type="file" id="input-file" accept="image/*" onchange="handleFileSelect(event)" class="text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500/20 file:text-amber-400 hover:file:bg-amber-500/30 cursor-pointer">
                        </div>
                        <div>
                            <input type="url" id="input-image" placeholder="或貼上照片網址 (Image URL)" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                        </div>
                    </div>
                    <div id="image-preview-box" class="hidden relative rounded-xl overflow-hidden border border-gray-700 h-32 bg-black">
                        <img id="image-preview" src="" class="w-full h-full object-cover">
                        <span class="absolute bottom-2 left-2 text-[10px] bg-black/70 text-amber-400 px-2 py-0.5 rounded">圖片預覽</span>
                    </div>
                </div>

                <div class="pt-3 border-t border-gray-800 flex justify-end gap-3">
                    <button type="button" onclick="closeSubmitModal()" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-medium transition">取消</button>
                    <button type="submit" id="btn-submit" class="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-semibold text-sm transition shadow-lg shadow-amber-500/20 flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>同步上載至地圖</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- DETAIL MODAL FOR STORY DETAILS -->
    <div id="modal-detail" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-3xl w-full overflow-hidden shadow-2xl relative flex flex-col md:flex-row max-h-[90vh]">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-black/60 hover:bg-black text-white flex items-center justify-center backdrop-blur-md transition">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Image Section -->
            <div class="md:w-1/2 relative bg-black min-h-[260px] md:min-h-full">
                <img id="detail-img" src="" alt="Street Color" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent md:hidden"></div>
                <div class="absolute bottom-3 left-3 flex gap-2">
                    <span id="detail-tag-badge" class="px-2.5 py-1 rounded-lg text-xs font-bold shadow-md"></span>
                    <span id="detail-cat-badge" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-black/60 text-gray-200 border border-gray-700 backdrop-blur-md"></span>
                </div>
            </div>

            <!-- Content Section -->
            <div class="md:w-1/2 p-6 md:p-8 flex flex-col justify-between overflow-y-auto">
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                        <div>
                            <p class="text-xs text-amber-500 font-semibold tracking-wider uppercase" id="detail-author-info"></p>
                            <h3 class="text-lg font-bold text-white flex items-center gap-1.5 mt-0.5" id="detail-location"></h3>
                        </div>
                    </div>

                    <!-- Literary Quote -->
                    <div class="bg-amber-500/5 border-l-2 border-amber-500 p-4 rounded-r-xl">
                        <p class="text-xs text-amber-400 font-semibold uppercase tracking-wider mb-1">一句話詩行</p>
                        <blockquote class="text-base font-serif italic text-gray-100 leading-relaxed" id="detail-quote"></blockquote>
                    </div>

                    <!-- Description -->
                    <div>
                        <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">五感與色彩觀察</h4>
                        <p class="text-sm text-gray-300 leading-relaxed font-sans" id="detail-desc"></p>
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-800 flex items-center justify-between text-xs text-gray-500">
                    <span id="detail-coords"><i class="fa-solid fa-location-dot text-amber-500 mr-1"></i></span>
                    <button onclick="shareItem()" class="hover:text-amber-400 transition flex items-center gap-1">
                        <i class="fa-regular fa-share-from-square"></i> 分享文學視角
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-amber-500 text-black font-semibold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-msg">故事發佈成功！</span>
    </div>

    <!-- FIREBASE MODULE & APPLICATION LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // APP GLOBAL CONSTANTS
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'community-color-lit-map';
        let db = null;
        let auth = null;
        let currentUser = null;

        // Preset Color Styles Config
        const COLOR_CONFIGS = {
            '褪色紅': { bg: '#ef4444', text: '#ffffff', class: 'bg-red-500/20 text-red-400 border-red-500/40', pinColor: '#ef4444' },

        };

        // Fallback Initial Seed Data
        const INITIAL_SEED_DATA = [
            {
                id: "seed-1",
                author: "張曉華",
                studentClass: "4A (05)",
                location: "深水埗基隆街 128 號",
                category: "舊區街道",
                tag: "褪色紅",
                lat: 22.3278,
                lng: 114.1624,
                quote: "「歲月剝落了斑駁的紅漆，門聯上的字跡模糊，卻留下了幾代人進出的溫度。」",
                desc: "在木門邊緣發現這層疊塗抹過數次的油漆，層層剝落處露出舊時代的木紋。菜市場喧鬧的聲音與老舊門框形成強烈對比。",
                image: "https://images.unsplash.com/photo-1518002171257-230972693757?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: "seed-2",
                author: "李子健",
                studentClass: "4B (18)",
                location: "中環花園道 / 商業大樓群",
                category: "新式街道",
                tag: "冷白灰",
                lat: 22.2783,
                lng: 114.1592,
                quote: "「光滑的鋼條與冰冷的玻璃，反射著天光的冷白，將匆忙的足音阻隔在秩序之外。」",
                desc: "商業區的大理石牆面極其平整，光線穿透玻璃帷幕照射出來，乾淨利落，卻有種難以親近的距離感。",
                image: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: "seed-3",
                author: "王文蔚",
                studentClass: "4A (22)",
                location: "旺角花園街夜市",
                category: "舊區街道",
                tag: "暖黃燈",
                lat: 22.3193,
                lng: 114.1717,
                quote: "「昏黃的燈光下，熱氣騰騰的燒賣與喧鬧的吆喝，交織出整座城市最溫暖的腹地。」",
                desc: "傳統小吃檔口懸掛著暖黃色的圓形泡燈，油煙與光影融為一體，給寒風中的行人提供了棲身與飽腹的慰藉。",
                image: "https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: "seed-4",
                author: "陳嘉樂",
                studentClass: "4C (03)",
                location: "灣仔石水渠街",
                category: "舊區街道",
                tag: "生鏽綠",
                lat: 22.2736,
                lng: 114.1728,
                quote: "「野草從生鏽的鐵窗縫隙裡竄出，那一抹頑強的綠，是時間給舊建築的呼吸。」",
                desc: "老舊唐樓的窗框塗層生鏽脫落，小雨過後，苔蘚與蕨類植物在磚縫中肆意生長，展現極強的生命張力。",
                image: "https://images.unsplash.com/photo-1508873696983-2df515122519?auto=format&fit=crop&w=800&q=80"
            }
        ];

        // Global State
        window.literatureData = [];
        window.map = null;
        window.markersGroup = null;
        window.activeFilter = '全部';
        window.currentView = 'map';
        window.base64ImageStr = "";

        // INITIALIZE FIREBASE & APP
        async function initApp() {
            initMap();
            renderFilterButtons();

            try {
                if (typeof __firebase_config !== 'undefined') {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    // Auth Workflow
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) {
                            updateStatusPill(true, "☁️ 雲端數據已連線");
                            listenToCloudData();
                        }
                    });
                } else {
                    console.warn("No Firebase config detected. Using local seed data mode.");
                    updateStatusPill(false, "本地示範模式");
                    window.literatureData = [...INITIAL_SEED_DATA];
                    refreshUI();
                }
            } catch (err) {
                console.error("Firebase init error:", err);
                updateStatusPill(false, "離線示範模式");
                window.literatureData = [...INITIAL_SEED_DATA];
                refreshUI();
            }
        }

        // LISTEN TO FIRESTORE REALTIME SNAPSHOT (RULE 1 & RULE 2)
        function listenToCloudData() {
            if (!db) return;

            // Public Collection Path according to MANDATORY RULE 1: /artifacts/{appId}/public/data/color_posts
            const postsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'color_posts');

            // Simple snapshot without complex orderBy (MANDATORY RULE 2)
            onSnapshot(postsCollection, (snapshot) => {
                const cloudItems = [];
                snapshot.forEach(docSnap => {
                    cloudItems.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (cloudItems.length > 0) {
                    window.literatureData = cloudItems;
                } else {
                    window.literatureData = [...INITIAL_SEED_DATA];
                }

                refreshUI();
            }, (error) => {
                console.error("Firestore onSnapshot error:", error);
                updateStatusPill(false, "讀取雲端失敗");
                if (window.literatureData.length === 0) {
                    window.literatureData = [...INITIAL_SEED_DATA];
                    refreshUI();
                }
            });
        }

        // LEAFLET MAP INIT
        function initMap() {
            window.map = L.map('map', { zoomControl: false }).setView([22.3050, 114.1680], 13);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                maxZoom: 19
            }).addTo(window.map);

            L.control.zoom({ position: 'topright' }).addTo(window.map);

            window.markersGroup = L.layerGroup().addTo(window.map);

            // Click listener for picker
            window.map.on('click', function(e) {
                document.getElementById('input-lat').value = e.latlng.lat.toFixed(5);
                document.getElementById('input-lng').value = e.latlng.lng.toFixed(5);
                showToast(`已選取坐標: ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`);
            });
        }

        // RENDER MARKERS ON MAP
        function renderMapMarkers() {
            if (!window.markersGroup) return;
            window.markersGroup.clearLayers();

            const filtered = filterData();

            filtered.forEach(item => {
                const config = COLOR_CONFIGS[item.tag] || { pinColor: '#f59e0b' };

                const customIcon = L.divIcon({
                    className: 'custom-pin-wrapper',
                    html: `
                        <div class="custom-pin" style="background-color: ${config.pinColor}; width: 28px; height: 28px; border: 2px solid #ffffff; border-radius: 50%;">
                            <i class="fa-solid fa-camera text-xs" style="color: ${item.tag === '暖黃燈' ? '#000' : '#fff'}"></i>
                        </div>
                    `,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([item.lat, item.lng], { icon: customIcon });

                const popupContent = `
                    <div class="w-64 p-1">
                        <img src="${item.image}" alt="${item.location}" class="w-full h-28 object-cover rounded-lg mb-2">
                        <div class="flex items-center gap-1.5 mb-1">
                            <span class="px-2 py-0.5 text-[10px] font-bold rounded" style="background-color: ${config.pinColor}22; color: ${config.pinColor}; border: 1px solid ${config.pinColor}44">${item.tag}</span>
                            <span class="text-[10px] text-gray-400 bg-gray-800 px-1.5 py-0.5 rounded">${item.category}</span>
                        </div>
                        <h4 class="font-bold text-sm text-white mb-1 truncate">${item.location}</h4>
                        <p class="text-xs font-serif italic text-amber-200 line-clamp-2 mb-2">${item.quote}</p>
                        <div class="flex items-center justify-between text-[11px] text-gray-400 pt-2 border-t border-gray-800">
                            <span>${item.author} (${item.studentClass || '學生'})</span>
                            <button onclick="openDetailModal('${item.id}')" class="text-amber-400 font-medium hover:underline">展開詳情 <i class="fa-solid fa-arrow-right text-[10px]"></i></button>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);
                window.markersGroup.addLayer(marker);
            });
        }

        // REFRESH UI
        function refreshUI() {
            renderMapMarkers();
            renderGalleryCards();
            updateStats();
        }

        // FILTER DATA
        function filterData() {
            if (window.activeFilter === '全部') return window.literatureData;
            return window.literatureData.filter(item => item.tag === window.activeFilter || item.category === window.activeFilter);
        }

        // FILTER BUTTONS
        function renderFilterButtons() {
            const container = document.getElementById('filter-buttons');
            const tags = ['全部', '褪色紅', '生鏽綠', '暖黃燈', '冷白灰', '霓虹紅', '舊區街道', '新式街道'];

            container.innerHTML = tags.map(tag => {
                const isActive = window.activeFilter === tag;
                const activeClass = isActive 
                    ? 'bg-amber-500 text-black font-semibold shadow-md' 
                    : 'bg-gray-800/80 text-gray-300 hover:bg-gray-700 border border-gray-700/60';

                return `
                    <button onclick="setFilter('${tag}')" class="px-3.5 py-1.5 rounded-xl text-xs whitespace-nowrap transition-all ${activeClass}">
                        ${tag}
                    </button>
                `;
            }).join('');
        }

        window.setFilter = function(tag) {
            window.activeFilter = tag;
            renderFilterButtons();
            refreshUI();
        };

        // RENDER GALLERY CARDS
        function renderGalleryCards() {
            const container = document.getElementById('gallery-grid');
            const filtered = filterData();

            document.getElementById('gallery-count').innerText = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-gray-500">
                        <i class="fa-solid fa-palette text-4xl mb-3 text-gray-600"></i>
                        <p>未找到符合「${window.activeFilter}」條件的色彩作品</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const config = COLOR_CONFIGS[item.tag] || { class: 'bg-amber-500/20 text-amber-400' };

                return `
                    <div onclick="openDetailModal('${item.id}')" class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden hover:border-amber-500/50 transition-all duration-300 group cursor-pointer flex flex-col justify-between shadow-lg">
                        <div>
                            <div class="relative h-48 overflow-hidden bg-gray-950">
                                <img src="${item.image}" alt="${item.location}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute top-3 left-3 flex gap-2">
                                    <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${config.class}">${item.tag}</span>
                                    <span class="px-2.5 py-1 rounded-lg text-xs font-medium bg-black/60 text-gray-200 backdrop-blur-md">${item.category}</span>
                                </div>
                            </div>
                            <div class="p-5 space-y-3">
                                <h3 class="font-bold text-white text-base group-hover:text-amber-400 transition-colors flex items-center gap-1.5">
                                    <i class="fa-solid fa-location-dot text-amber-500 text-xs"></i> ${item.location}
                                </h3>
                                <blockquote class="text-sm font-serif italic text-amber-200/90 leading-relaxed bg-amber-500/5 p-3 rounded-xl border-l-2 border-amber-500">
                                    ${item.quote}
                                </blockquote>
                                <p class="text-xs text-gray-400 line-clamp-2">${item.desc}</p>
                            </div>
                        </div>
                        <div class="px-5 py-3.5 bg-gray-950/60 border-t border-gray-800/80 flex items-center justify-between text-xs text-gray-400">
                            <span><i class="fa-regular fa-user mr-1 text-amber-500"></i>${item.author} (${item.studentClass || '學生'})</span>
                            <span class="text-amber-400 hover:underline">觀看細節 <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // UPDATE STATS
        function updateStats() {
            document.getElementById('stat-count').innerText = `${filterData().length} 處`;
        }

        // UPDATE STATUS PILL
        function updateStatusPill(isOnline, text) {
            const pill = document.getElementById('sync-status');
            if (isOnline) {
                pill.className = "text-xs font-sans font-normal px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5";
                pill.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span>${text}</span>`;
            } else {
                pill.className = "text-xs font-sans font-normal px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center gap-1.5";
                pill.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span><span>${text}</span>`;
            }
        }

        // SUBMIT FORM TO FIRESTORE
        window.handleFormSubmit = async function(e) {
            e.preventDefault();

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 上載同步中...`;

            const author = document.getElementById('input-author').value;
            const studentClass = document.getElementById('input-class').value;
            const tag = document.getElementById('input-tag').value;
            const category = document.getElementById('input-category').value;
            const location = document.getElementById('input-location').value;
            const lat = parseFloat(document.getElementById('input-lat').value) || 22.3278;
            const lng = parseFloat(document.getElementById('input-lng').value) || 114.1624;
            const quote = document.getElementById('input-quote').value;
            const desc = document.getElementById('input-desc').value;
            let image = window.base64ImageStr || document.getElementById('input-image').value;

            // Fallback Default Image
            if (!image) {
                const sampleImgs = {
                    '褪色紅': 'https://images.unsplash.com/photo-1518002171257-230972693757?auto=format&fit=crop&w=800&q=80',
                    '生鏽綠': 'https://images.unsplash.com/photo-1508873696983-2df515122519?auto=format&fit=crop&w=800&q=80',
                    '暖黃燈': 'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=800&q=80',
                    '冷白灰': 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80',
                    '霓虹紅': 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=800&q=80'
                };
                image = sampleImgs[tag] || sampleImgs['暖黃燈'];
            }

            const newPost = {
                author,
                studentClass,
                location,
                category,
                tag,
                lat,
                lng,
                quote: `「${quote.replace(/[「」]/g, '')}」`,
                desc,
                image,
                createdAt: new Date().toISOString(),
                userId: currentUser ? currentUser.uid : 'anonymous'
            };

            try {
                if (db) {
                    const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'color_posts');
                    await addDoc(postsRef, newPost);
                    showToast('✅ 成功同步至全級雲端地圖！');
                } else {
                    // Local fallback
                    newPost.id = 'local-' + Date.now();
                    window.literatureData.unshift(newPost);
                    refreshUI();
                    showToast('已儲存至本地視角！');
                }

                if (window.map) window.map.flyTo([lat, lng], 15);
                closeSubmitModal();
                document.getElementById('form-submit-story').reset();
                window.base64ImageStr = "";
                document.getElementById('image-preview-box').classList.add('hidden');
            } catch (err) {
                console.error("Write error:", err);
                showToast('❌ 發佈失敗，請重試');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i><span>同步上載至地圖</span>`;
            }
        };

        // IMAGE FILE CONVERSION TO BASE64
        window.handleFileSelect = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                window.base64ImageStr = evt.target.result;
                document.getElementById('image-preview').src = evt.target.result;
                document.getElementById('image-preview-box').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        };

        // START APP ON DOM LOAD
        window.addEventListener('DOMContentLoaded', initApp);
    </script>

    <!-- HELPER UI FUNCTIONS -->
    <script>
        // SWITCH VIEW (MAP vs GALLERY)
        function switchView(view) {
            window.currentView = view;
            const mapContainer = document.getElementById('view-map-container');
            const galleryContainer = document.getElementById('view-gallery-container');
            const btnMap = document.getElementById('btn-view-map');
            const btnGallery = document.getElementById('btn-view-gallery');

            if (view === 'map') {
                mapContainer.classList.remove('hidden');
                galleryContainer.classList.add('hidden');
                btnMap.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg font-medium transition-all bg-amber-500 text-black shadow-md";
                btnGallery.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg font-medium text-gray-400 hover:text-white transition-all";
                if (window.map) setTimeout(() => window.map.invalidateSize(), 200);
            } else {
                mapContainer.classList.add('hidden');
                galleryContainer.classList.remove('hidden');
                btnGallery.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg font-medium transition-all bg-amber-500 text-black shadow-md";
                btnMap.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg font-medium text-gray-400 hover:text-white transition-all";
            }
        }

        // DETAIL MODAL LOGIC
        function openDetailModal(id) {
            const item = window.literatureData.find(d => String(d.id) === String(id));
            if (!item) return;

            const COLOR_CONFIGS = {
                '褪色紅': { class: 'bg-red-500/20 text-red-400 border-red-500/40' },
                '生鏽綠': { class: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' },
                '暖黃燈': { class: 'bg-amber-500/20 text-amber-400 border-amber-500/40' },
                '冷白灰': { class: 'bg-gray-500/20 text-gray-300 border-gray-500/40' },
                '霓虹紅': { class: 'bg-rose-500/20 text-rose-400 border-rose-500/40' }
            };

            const config = COLOR_CONFIGS[item.tag] || { class: 'bg-amber-500/20 text-amber-400' };

            document.getElementById('detail-img').src = item.image;
            document.getElementById('detail-tag-badge').innerText = item.tag;
            document.getElementById('detail-tag-badge').className = `px-2.5 py-1 rounded-lg text-xs font-bold border ${config.class}`;
            document.getElementById('detail-cat-badge').innerText = item.category;
            
            document.getElementById('detail-author-info').innerText = `${item.author} · 班別 ${item.studentClass || '學生'}`;
            document.getElementById('detail-location').innerHTML = `<i class="fa-solid fa-location-dot text-amber-500"></i> ${item.location}`;
            document.getElementById('detail-quote').innerText = item.quote;
            document.getElementById('detail-desc').innerText = item.desc || "作者未提供詳細描述。";
            document.getElementById('detail-coords').innerHTML = `<i class="fa-solid fa-map-pin text-amber-500 mr-1"></i> 坐標: ${item.lat}, ${item.lng}`;

            const modal = document.getElementById('modal-detail');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeDetailModal() {
            const modal = document.getElementById('modal-detail');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // SUBMIT MODAL LOGIC
        function openSubmitModal() {
            if (!document.getElementById('input-lat').value) {
                document.getElementById('input-lat').value = "22.3278";
                document.getElementById('input-lng').value = "114.1624";
            }
            const modal = document.getElementById('modal-submit');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeSubmitModal() {
            const modal = document.getElementById('modal-submit');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // TOAST NOTIFICATION
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function shareItem() {
            showToast('已複製作品連結至剪貼簿！');
        }

        // AMBIENT SOUND GENERATOR (TONE.JS)
        let isAudioPlaying = false;
        let synth;

        function toggleAmbientAudio() {
            const icon = document.getElementById('audio-icon');
            
            if (!isAudioPlaying) {
                Tone.start();
                synth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 3, decay: 1, sustain: 0.8, release: 4 }
                }).toDestination();
                synth.volume.value = -24;

                synth.triggerAttack('C3');

                isAudioPlaying = true;
                icon.className = "fa-solid fa-volume-high text-amber-400 animate-pulse";
                showToast('已開啟街道情境音效');
            } else {
                if (synth) synth.triggerRelease();
                isAudioPlaying = false;
                icon.className = "fa-solid fa-volume-xmark text-gray-400";
                showToast('已關閉音效');
            }
        }
    </script>
</body>
</html>
